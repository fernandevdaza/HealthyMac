<!doctype html>
<!-- Source of docs/banner.png and docs/banner.es.png. Regenerate them with scripts/make_banner.sh. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  /* The app's light tokens (docs/DESIGN.md): neutral greys, colour only for state. */
  :root { --bg: #f2f2f4; --text-1: #111113; --text-2: #5c5c61; --hairline: rgba(0, 0, 0, .09); }
  html, body { width: 1280px; height: 480px; overflow: hidden; background: var(--bg); }
  body {
    position: relative; color: var(--text-1);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 430px;
          display: flex; flex-direction: column; justify-content: center; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo img { width: 64px; height: 64px; margin: -6px -2px -6px -8px; }
  .logo b { font-size: 26px; font-weight: 600; letter-spacing: -.4px; }
  h1 { margin-top: 34px; font-size: 56px; line-height: 60px; font-weight: 700; letter-spacing: -1.6px; }
  p { margin-top: 20px; font-size: 20px; line-height: 29px; color: var(--text-2); letter-spacing: -.1px;
      text-wrap: balance; }
  .shot {
    position: absolute; left: 548px; top: 50%; transform: translateY(-50%); width: 672px;
    border-radius: 10px; overflow: hidden; background: #fff;
    box-shadow: 0 0 0 1px var(--hairline), 0 18px 44px rgba(0, 0, 0, .12), 0 2px 6px rgba(0, 0, 0, .06);
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="left">
    <div class="logo">
      <img src="../crates/hm-app/assets/AppIcon-light.png" alt="">
      <b>HealthyMac</b>
    </div>
    <h1 data-en="Clean your Mac,<br>honestly." data-es="Limpia tu Mac,<br>sin engaños."></h1>
    <p data-en="See what is really eating your disk and get it back safely."
       data-es="Mira qué se está comiendo tu disco de verdad y recupéralo con seguridad."></p>
  </div>

  <div class="shot"><img alt=""></div>

  <script>
    const lang = new URLSearchParams(location.search).get("lang") === "es" ? "es" : "en";
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll("[data-en]")) el.innerHTML = el.dataset[lang];
    document.querySelector(".shot img").src = `screenshots/overview-${lang}-light.jpg`;
  </script>
</body>
</html>
